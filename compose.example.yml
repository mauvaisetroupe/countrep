# EXEMPLE pour essayer CountRep : base, migrations, API et interface.
# Ce n'est pas une composition de production : sauvegardes, proxy HTTPS,
# limites des journaux et secrets restent à la charge de l'exploitant
# (docs/exploitation.md).
#
# Dans un dossier vide, avec ce fichier et un fichier .env :
#
#   COUNTREP_VERSION=1.0.0
#   DB_PASSWORD=<mot de passe>
#   JWT_SECRET=<openssl rand -base64 48>
#   GOOGLE_CLIENT_IDS=<client ID OAuth Web>
#
#   docker compose -f compose.example.yml up -d
#   curl http://127.0.0.1:3000/api/health/db

name: countrep-example

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: countrep
      POSTGRES_USER: countrep
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'countrep', '-d', 'countrep']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applique les migrations, puis s'arrête. Même version que l'API.
  migrations:
    image: ${MIGRATIONS_IMAGE:-ghcr.io/mauvaisetroupe/countrep-migrations}:${COUNTREP_VERSION:?}
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/countrep
      FLYWAY_USER: countrep
      FLYWAY_PASSWORD: ${DB_PASSWORD:?}
      # Une seule fois, pour reprendre une base créée sans Flyway
      # (voir docs/exploitation.md), puis retirer ces deux lignes :
      # FLYWAY_BASELINE_ON_MIGRATE: 'true'
      # FLYWAY_BASELINE_VERSION: '1'
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-ghcr.io/mauvaisetroupe/countrep}:${COUNTREP_VERSION:?}
    init: true
    read_only: true
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: countrep
      DATABASE_USER: countrep
      DATABASE_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:?}
      # L'adresse à laquelle les navigateurs ouvrent l'application
      EXPECTED_ORIGIN: ${EXPECTED_ORIGIN:-http://127.0.0.1:3000}
    ports:
      - ${API_PUBLISH:-127.0.0.1:3000}:3000
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
